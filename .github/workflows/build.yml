name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['website/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['website/**']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Xcode version
        run: xcodebuild -version
      - name: Build app
        run: ./scripts/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MiliShip-app
          path: build/MiliShip.app
          retention-days: 7
